# Global core.hooksPath (~/.git-hooks, lefthook shim) bypasses .git/hooks, so
# this file is what actually enforces encryption checks at commit time on
# hosts with that shim. Hosts without it use the .git/hooks/pre-commit chain
# from docs/glassine-migration.md.
pre-commit:
  parallel: false
  commands:
    crypt-patterns:
      run: scripts/check-crypt-patterns.sh
    glassine-check:
      run: glassine check
    # The scancel guard is a safety control: a bypass in it costs peer workers' queued
    # compute, and every bypass found so far was a one-line addition to these suites.
    # Run them here, since the repo has no CI to run them anywhere else. Mirrored into
    # .pre-commit-config.yaml, which is the path a clone without the shim takes. Two
    # commands rather than one `&&` chain, so a failure in one still reports the other.
    scancel-hook-tests:
      run: python3 tests/block_unscoped_scancel_test.py
    scancel-mine-tests:
      run: zsh -f tests/scancel-mine.test.zsh
    # The daily autoupdate now stashes, fast-forwards and reapplies, so a regression
    # in it rewrites tracked config on every host unattended — an unconditional
    # `git stash pop` once left conflict markers in a live settings.json.
    autoupdate-tests:
      run: bash tests/dotfiles-autoupdate.test.sh
    # link::prune_stale deletes files on every bootstrap of every host, so a
    # regression in what it considers "undeclared drift" is destructive.
    link-symlinks-tests:
      run: bash tests/link-symlinks.test.sh
    # prose-lint's newest rules ban `the gap` only as a summarising predicate, and
    # the guide's own Abstract section depends on the literal sense staying legal.
    # A word-list "simplification" reads as tidier and quietly kills the carve-out.
    prose-lint-tests:
      run: bash tests/prose-lint.test.sh
