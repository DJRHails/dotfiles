repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.95.5
    hooks:
      - id: trufflehog
  - repo: local
    hooks:
      - id: check-crypt-patterns
        name: check glassine rules match tracked files
        entry: scripts/check-crypt-patterns.sh
        language: script
        pass_filenames: false
      - id: glassine-check
        name: staged glassine-managed files are encrypted
        entry: glassine check
        language: system
        pass_filenames: false
      # The scancel guard is a safety control: a bypass in it costs peer workers' queued
      # compute, and every bypass found so far was a one-line addition to these suites.
      # Mirrored from lefthook.yml — this is the path a clone without the ~/.git-hooks
      # shim takes, and the repo has no CI to run them anywhere else. Kept as two hooks so
      # a failure in one still reports the other.
      - id: scancel-hook-tests
        name: scancel guard hook suite
        entry: python3 tests/block_unscoped_scancel_test.py
        language: system
        pass_filenames: false
      - id: scancel-mine-tests
        name: scancel-mine behaviour suite
        entry: zsh -f tests/scancel-mine.test.zsh
        language: system
        pass_filenames: false
      # The daily autoupdate now stashes, fast-forwards and reapplies, so a regression
      # in it rewrites tracked config on every host unattended — an unconditional
      # `git stash pop` once left conflict markers in a live settings.json.
      - id: autoupdate-tests
        name: dotfiles-autoupdate behaviour suite
        entry: bash tests/dotfiles-autoupdate.test.sh
        language: system
        pass_filenames: false
      # link::prune_stale deletes files on every bootstrap of every host, so a
      # regression in what it considers "undeclared drift" is destructive.
      - id: link-symlinks-tests
        name: symlink linker behaviour suite
        entry: bash tests/link-symlinks.test.sh
        language: system
        pass_filenames: false
