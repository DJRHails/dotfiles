# Self-hosted GitHub Actions runner pools on taffy — one line per repo.
#
#     <owner>/<repo>  <count>
#
# GitHub-hosted runners are billed per minute; taffy's are free. Every repo that
# runs CI belongs here. `provision.sh` reconciles taffy against this file: it
# creates missing runners and DEREGISTERS any beyond <count>, so lowering a
# number is how you scale a pool down. To drain a pool set its count to 0 —
# deleting the line leaves its runners running unmanaged.
#
# Sizing: <count> is the max jobs that can run concurrently for that repo, so it
# should be at least the widest fan-out in its workflows (a 2-job CI wants 2, or
# the second job waits for the first). Idle runners cost ~120 MB each and taffy
# has 48 cores / 125 GB, so round up rather than down.
#
# Public repos still list a pool here — their workflows self-host the trusted
# events (push, release, schedule, dispatch) and leave fork pull_request on
# GitHub-hosted runners. See the `github-actions` skill for why.

# Research + agent fleet — the heavy CI.
DJRHails/touchstone                4
DJRHails/gauntlet                  4
DJRHails/bestiary                  2
DJRHails/gantry                    2
DJRHails/bogusbench                2

# Sites and services with real CI.
DJRHails/hails.info                2
DJRHails/decal                     2
DJRHails/ds.desert-island-discs    2
DJRHails/tacit.page                2
DJRHails/turnstile                 2
DJRHails/hapax                     2
DJRHails/tallow                    2

# Deploy-only — one job, one runner.
DJRHails/isogram                   1
DJRHails/koi-pond                  1
DJRHails/portcullis                1

# Public repos — trusted events only (see header).
DJRHails/agent-browser             3
DJRHails/emboss                    2
DJRHails/graphs                    2
# Nightly patch-stack sync only, via the reusable workflow in
# DJRHails/patch-stack-action — usable once that workflow's `runner` input ships
# and the caller passes the taffy labels.
DJRHails/pi-interactive-subagents  1

# Deliberately absent — glassine. Its only workflow is an ubuntu+macOS matrix on
# a public repo, and threading a fork guard through a matrix leg is unreadable
# for the ~$0.04/9d it would save, so it stays GitHub-hosted.
#
# Note: DJRHails/touchstone and DJRHails/bogusbench (under "Research + agent
# fleet") are hard-pinned to this pool with NO hosted fallback (2026-08-05
# owner call), so their workflows read no CI_FALLBACK at all. They still need
# runners, hence their entries.
