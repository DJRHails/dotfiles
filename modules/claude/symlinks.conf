# settings.json / settings.ant.json are deliberately NOT symlinked: Claude Code
# writes the live `model` back into its settings file when you run `/model`, and
# a symlink made that a commit against this repo (a `/model` switch rewrote the
# tracked default and then blocked the daily autoupdate on a dirty tree).
# setup.sh materialises them as real files instead, merging the tracked defaults
# over whatever the app has written.
mcp.json -> ~/.agents/mcp.json
mcp.json -> ~/.claude/mcp.json
mcp.json -> ~/.claude-ant/mcp.json
mcp.json -> ~/.claude-ant-safe/mcp.json
